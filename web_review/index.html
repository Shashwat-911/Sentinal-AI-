<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentinel incident review</title><link rel="stylesheet" href="/style.css"></head><body><main>
<div class="eyebrow">SENTINEL AI / BROWSER REVIEW</div><h1>Review the evidence.</h1><p>Import saved incident JSON from the desktop dashboard. Changes here stay in this browser session until you download them. This view does not run camera detection or estimate risk.</p>
<section><h2>Import incident reports</h2><label for="file">Incident JSON file</label><input type="file" id="file" accept=".json,application/json"><label for="source">Report JSON</label><textarea id="source" spellcheck="false" placeholder="Paste an incident object or array"></textarea><div class="actions"><button id="load">Review reports</button><button id="sample">Load synthetic example</button></div><p role="alert" id="error"></p></section>
<section><h2>Incident feed</h2><label for="severity">Severity filter</label><select id="severity"><option>All</option><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option><option>NORMAL</option></select><p id="count" role="status">No reports loaded</p><div id="reports"></div><button id="download" disabled>Download reviewed JSON</button></section>
</main><script src="/app.js"></script></body></html>
